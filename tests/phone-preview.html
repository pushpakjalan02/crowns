<!doctype html>
<!--
  Shows the app inside phone-sized frames, side by side, so you can check the
  layout on a laptop. Double-click to open. Each frame is a live, playable app.
  Add more frames by copying an <iframe> line and changing the #/... part.
-->
<html>
<head>
<meta charset="utf-8">
<title>Phone preview</title>
<style>
  body { margin: 0; padding: 16px; background: #888; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { color: #fff; font-size: 13px; margin-bottom: 4px; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; background: #fff; }
</style>
</head>
<body>
<div class="row">
  <figure><figcaption>Home (iPhone 14 size, 390×844)</figcaption><iframe src="../app/index.html#/"></iframe></figure>
  <figure><figcaption>Level 12 (6×6)</figcaption><iframe src="../app/index.html#/play/12"></iframe></figure>
  <figure><figcaption>Level 151 (10×10)</figcaption><iframe src="../app/index.html#/play/151"></iframe></figure>
  <figure><figcaption>Level picker</figcaption><iframe src="../app/index.html#/levels"></iframe></figure>
</div>
</body>
</html>
